name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Example drafts still pass
        run: |
          for f in ideas/*.toml; do python -m dbc --today 2026-10-06 draft "$f" --out /tmp/drafts; done
