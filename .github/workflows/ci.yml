name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]   # 3.10 is what the xCloud VPS has
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Example drafts still pass
        run: |
          for f in ideas/*.toml; do python -m dbc --today 2026-10-06 draft "$f" --out /tmp/drafts; done
